# The domain signal table (SPEC-0074 rule 5; brief #1936, ADR-0805), beside config/stack-signals.toml and in its form:
# one [[domain]] row per shipped pack of config/domains/, naming plain words a person or a vision may use, file names
# and package names that suggest the domain. A signal is a proposal for a person to confirm, never an assumption.
# `python3 scripts/agk/front_door.py check-signals` checks its form. Reading it to propose a domain is build (c).

[[domain]]
name = "payments"
words = ["payment", "payments", "checkout", "refund", "chargeback", "settlement", "acquirer", "card", "merchant"]
files = ["payments.py", "checkout.py", "refunds.py"]
dependencies = []

[[domain]]
name = "field-service"
words = ["technician", "dispatch", "work-order", "job", "visit", "site", "appointment", "crew"]
files = ["dispatch.py", "work_orders.py"]
dependencies = []
