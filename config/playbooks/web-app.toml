format = 1
work_type = "web-app"
title = "Contract first, then mocks, then front end and back end in parallel, then joins by demo value"
heavy_steps = ["e2e smoke run"]
evidence = [
  "the contract test output",
  "the mock parity output",
  "the e2e smoke run record of the merge batch",
  "the accessibility review",
]

[[phases]]
name = "contract"
order = 1
after = []

[[phases]]
name = "mocks"
order = 2
after = ["contract"]

[[phases]]
name = "front-end"
order = 3
after = ["mocks"]

[[phases]]
name = "back-end"
order = 3
after = ["mocks"]

[[phases]]
name = "joins"
order = 4
after = ["front-end", "back-end"]

[split]
brief_order = ["foundation", "contract", "mock", "front-end", "back-end", "join"]
depends_on = [
  ["mock", "contract"],
  ["front-end", "mock"],
  ["back-end", "mock"],
  ["join", "front-end"],
  ["join", "back-end"],
]

[[lanes]]
name = "front-end"
kinds = ["front-end"]

[[lanes]]
name = "back-end"
kinds = ["back-end"]

[testing]
profile = "balanced"
always_full = ["contracts/**"]
map = [
  { code = "contracts/**", tests = "tests/contract/**" },
  { code = "mocks/**", tests = "tests/mocks/**" },
  { code = "frontend/**", tests = "tests/frontend/**" },
  { code = "backend/**", tests = "tests/backend/**" },
]

[architecture]
layers = [
  { name = "contracts", paths = ["contracts/**"] },
  { name = "mocks", paths = ["mocks/**"] },
  { name = "frontend", paths = ["frontend/**"] },
  { name = "backend", paths = ["backend/**"] },
]
allow = [
  { from = "frontend", to = "contracts" },
  { from = "backend", to = "contracts" },
  { from = "mocks", to = "contracts" },
]

[[gates]]
id = "contract-tests"
kind = "check"
text = "Contract tests: every operation of contracts/openapi.json (OpenAPI 3.1 in JSON) is named by a test under test_dirs (ADR-0677)."
step = "contract-tests"
owner_only = false

[[gates]]
id = "mock-parity"
kind = "check"
text = "Mock parity: every operation of the contract has a mock under mocks/ with the same operationId and response keys (ADR-0677)."
step = "mock-parity"
owner_only = false

[[gates]]
id = "e2e-smoke"
kind = "judgement"
text = "An end-to-end smoke run per merge batch; its run record is the evidence."
owner_only = false

[[gates]]
id = "accessibility"
kind = "judgement"
text = "Accessibility to WCAG 2.2 level AA, unless the discovery's accessibility answer names another standard, with the checks of SPEC-0037 where a prototype exists."
owner_only = false
reason = "No step reads the rendered screens yet; a reviewer reads them against the prototype."

[milestones]
shape = "per-batch"
batch_by = "demo value: the joins that show the most in a demo come first"

[[claims]]
text = "Front end and back end are built in parallel lanes against the contract and its mocks, so a feature is expected to finish sooner than when the two sides are built one after the other."
basis = "expected"

[[claims]]
text = "Contract tests and mock parity find a mismatch between the two sides before the joins, so fewer join briefs are expected to need a fix."
basis = "expected"

[[discovery]]
id = "constraints"
text = "What limits the work: a deadline, a budget, a team's skills, or parts that must stay as they are?"

[[discovery]]
id = "success"
text = "Which results in the browser show that the work succeeded, and how will each be measured?"

[[discovery]]
id = "data-rules"
text = "Which rules apply to the data the pages and the back end read, keep or send on?"

[[discovery]]
id = "environments"
text = "Which environments must it run in, from a developer's machine to production?"

[[discovery]]
id = "non-functional"
text = "Which needs of page speed, uptime, security and accessibility must it meet?"

# The Python standards pack (SPEC-0072 rule 6; brief #1589, ADR-0669), one entry for each Python stack, moved here from
# default.toml by brief #1638; it runs only when the Accepted stack record chose Python. `rules` pins ruff from
# config/ci-tools.txt; the type step's mypy is pinned there too.
[[standards]]
stack = "python-pyproject"
lint = "python-lint"
format = "python-format"
type = "python-type"
config = "pyproject.toml"
rules = { tool = "ruff", version = "0.17.4", codes = ["E", "F", "I", "B", "UP"] }

[[standards]]
stack = "python-pip"
lint = "python-lint"
format = "python-format"
type = "python-type"
config = "pyproject.toml"
rules = { tool = "ruff", version = "0.17.4", codes = ["E", "F", "I", "B", "UP"] }

# The Node standards pack (SPEC-0072 rule 6; brief #1764, ADR-0739): it runs only when the Accepted stack record chose
# Node and the product has a package.json. The tools are the product's own pinned eslint and prettier, so `rules` names
# no version; its codes are the floor, the rules of eslint:recommended that are on by default (Q-B4-1).
[[standards]]
stack = "node"
lint = "node-lint"
format = "node-format"
type = "node-type"
config = "package.json"
rules = { tool = "eslint", codes = [
  "constructor-super", "for-direction", "getter-return", "no-async-promise-executor", "no-case-declarations",
  "no-class-assign", "no-compare-neg-zero", "no-cond-assign", "no-const-assign", "no-constant-binary-expression",
  "no-constant-condition", "no-control-regex", "no-debugger", "no-delete-var", "no-dupe-args",
  "no-dupe-class-members", "no-dupe-else-if", "no-dupe-keys",
  "no-duplicate-case", "no-empty",
  "no-empty-character-class", "no-empty-pattern", "no-empty-static-block", "no-ex-assign", "no-extra-boolean-cast",
  "no-fallthrough", "no-func-assign", "no-global-assign", "no-import-assign", "no-invalid-regexp",
  "no-irregular-whitespace", "no-loss-of-precision", "no-misleading-character-class", "no-new-native-nonconstructor",
  "no-nonoctal-decimal-escape", "no-obj-calls", "no-octal", "no-prototype-builtins", "no-redeclare",
  "no-regex-spaces", "no-self-assign", "no-setter-return", "no-shadow-restricted-names", "no-sparse-arrays",
  "no-this-before-super", "no-undef", "no-unexpected-multiline", "no-unreachable", "no-unsafe-finally",
  "no-unsafe-negation", "no-unsafe-optional-chaining", "no-unused-labels", "no-unused-private-class-members",
  "no-unused-vars", "no-useless-backreference", "no-useless-catch", "no-useless-escape", "no-with", "require-yield",
  "use-isnan", "valid-typeof",
] }
