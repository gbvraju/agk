format = 1
work_type = "mcp-server"
title = "The mcp-server gates on the usual flow: tool schema contract tests, declared permission scopes and a prompt-injection test set"
heavy_steps = []
evidence = [
  "the tool schema contract test output, with the test glob the map names for each schema file",
  "the permission scopes each tool declares",
  "the prompt-injection test set and the output of the tests the map names for it",
]
lanes = []

[[phases]]
name = "build"
order = 1
after = []

[split]
brief_order = ["build"]
depends_on = []

[testing]
profile = "balanced"
always_full = []
map = []

[[gates]]
id = "tool-schema-contract-tests"
kind = "judgement"
text = "Tool schema contract tests: the testing map names a test glob for every schema file."
reason = "No path is named for the tool schema files yet, so no offline step can read it; a reviewer does (ADR-0666)."
owner_only = false

[[gates]]
id = "permission-scopes"
kind = "judgement"
text = "Permission scopes: every tool declares its scopes and none is a wildcard."
reason = "No path is named for the tools' scope declarations yet, so no offline step can read it; a reviewer does (ADR-0666)."
owner_only = false

[[gates]]
id = "prompt-injection-set"
kind = "judgement"
text = "A prompt-injection test set: the set exists and the testing map names its tests."
reason = "No path is named for the prompt-injection test set yet, so no offline step can read it; a reviewer does (ADR-0666)."
owner_only = false

[[gates]]
id = "accessibility"
kind = "judgement"
text = "Accessibility of the screens, where the work has any."
owner_only = false
reason = "This kind of work has no screens of its own, so there is nothing to check."

[milestones]
shape = "per-brief"
batch_by = "not batched: one pull request per brief, as today"

[[claims]]
text = "Every tool declares its scopes and is tested against a prompt-injection set while it is built, so fewer fix briefs are expected to chase an over-broad tool later."
basis = "expected"

[[discovery]]
id = "constraints"
text = "What limits the work: a deadline, a budget, a team's skills, or clients and tools that must stay as they are?"

[[discovery]]
id = "success"
text = "Which tool calls show that the work succeeded, and how will each be measured?"

[[discovery]]
id = "data-rules"
text = "Which rules apply to the data a tool reads, returns or sends on, and to what a tool may do with it?"

[[discovery]]
id = "environments"
text = "Which environments must it run in, from a developer's machine to production?"

[[discovery]]
id = "non-functional"
text = "Which needs of response time, uptime, security and permission scope must it meet?"
