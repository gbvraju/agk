format = 1
work_type = "mobile"
title = "The mobile gates on the usual flow: a device and simulator matrix, an offline state for every screen and the owner's store signing"
heavy_steps = []
evidence = [
  "the device and simulator matrix file and its results",
  "the screen inventory with the offline state of each screen",
  "the owner's record of the store signing",
]
lanes = []

[[phases]]
name = "build"
order = 1
after = []

[split]
brief_order = ["foundation", "build"]
depends_on = []

[testing]
profile = "balanced"
always_full = []
map = []

[[gates]]
id = "device-matrix"
kind = "judgement"
text = "A device and simulator matrix: the matrix file lists the minimum entries of this playbook."
reason = "No path is named for the device matrix file yet, so no offline step can read it; a reviewer does (ADR-0666)."
owner_only = false

[[gates]]
id = "device-matrix-results"
kind = "judgement"
text = "The results of the device and simulator matrix, recorded per entry; the matrix results are the evidence."
owner_only = false

[[gates]]
id = "offline-states"
kind = "judgement"
text = "Offline states: each screen of the inventory lists an offline state."
reason = "No path is named for the screen inventory yet, so no offline step can read it; a reviewer does (ADR-0666)."
owner_only = false

[[gates]]
id = "store-signing"
kind = "judgement"
text = "Store signing, done and recorded by the owner alone."
owner_only = true

[milestones]
shape = "per-brief"
batch_by = "not batched: one pull request per brief, as today"

[[claims]]
text = "An offline state listed for every screen of the inventory finds a missing offline path while the screen is built, so fewer fix briefs are expected to chase one later."
basis = "expected"

[[discovery]]
id = "constraints"
text = "What limits the work: a deadline, a budget, a team's skills, or store rules it must follow?"

[[discovery]]
id = "success"
text = "Which results on the device show that the work succeeded, and how will each be measured?"

[[discovery]]
id = "data-rules"
text = "Which rules apply to the data the app keeps on the device and sends on?"

[[discovery]]
id = "environments"
text = "Which environments must it run in, from a simulator to the devices of its users?"

[[discovery]]
id = "non-functional"
text = "Which needs of start time, battery use, offline use and security must it meet?"

# The Node standards pack (SPEC-0072 rule 6; brief #1764, ADR-0739): it runs only when the Accepted stack record chose
# Node and the product has a package.json. The tools are the product's own pinned eslint and prettier, so `rules` names
# no version; its codes are the floor, the rules of eslint:recommended that are on by default (Q-B4-1).
[[standards]]
stack = "node"
lint = "node-lint"
format = "node-format"
type = "node-type"
config = "package.json"
rules = { tool = "eslint", codes = [
  "constructor-super", "for-direction", "getter-return", "no-async-promise-executor", "no-case-declarations",
  "no-class-assign", "no-compare-neg-zero", "no-cond-assign", "no-const-assign", "no-constant-binary-expression",
  "no-constant-condition", "no-control-regex", "no-debugger", "no-delete-var", "no-dupe-args",
  "no-dupe-class-members", "no-dupe-else-if", "no-dupe-keys",
  "no-duplicate-case", "no-empty",
  "no-empty-character-class", "no-empty-pattern", "no-empty-static-block", "no-ex-assign", "no-extra-boolean-cast",
  "no-fallthrough", "no-func-assign", "no-global-assign", "no-import-assign", "no-invalid-regexp",
  "no-irregular-whitespace", "no-loss-of-precision", "no-misleading-character-class", "no-new-native-nonconstructor",
  "no-nonoctal-decimal-escape", "no-obj-calls", "no-octal", "no-prototype-builtins", "no-redeclare",
  "no-regex-spaces", "no-self-assign", "no-setter-return", "no-shadow-restricted-names", "no-sparse-arrays",
  "no-this-before-super", "no-undef", "no-unexpected-multiline", "no-unreachable", "no-unsafe-finally",
  "no-unsafe-negation", "no-unsafe-optional-chaining", "no-unused-labels", "no-unused-private-class-members",
  "no-unused-vars", "no-useless-backreference", "no-useless-catch", "no-useless-escape", "no-with", "require-yield",
  "use-isnan", "valid-typeof",
] }
