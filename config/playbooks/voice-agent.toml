[[discovery]]
id = "constraints"
text = "What limits the work: a deadline, a budget, a team's skills, or languages, phone lines and systems that must stay as they are?"

[[discovery]]
id = "success"
text = "Which outcomes of a spoken conversation show that the work succeeded, and how will each be measured?"

[[discovery]]
id = "data-rules"
text = "Which rules apply to the speech and transcripts the agent hears, keeps or passes on, and to consent to record them?"

[[discovery]]
id = "environments"
text = "Which environments must it run in, from a developer's machine to production?"

[[discovery]]
id = "non-functional"
text = "Which needs of response time, uptime, security and speech accuracy must it meet?"
