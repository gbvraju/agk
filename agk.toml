# One proof area for the kit's tests, so that prepush (and proof) run single test files instead of the whole `project_tests`
# command (prepush.regression_sets runs `project_tests` once when no [proof] table can take the selected files).
[proof.kit]
dirs = ["tests/kit", "tests/kit_dev"]
patterns = ["test_*.py"]
command = "(python3 -m pytest --version && ruff --version) >/dev/null 2>&1 || python3 -m pip install -q pytest ruff; AGK_KIT_TESTS=1 python3 -m pytest -c tests/kit/pytest.ini -q {files}"
cwd = "."
