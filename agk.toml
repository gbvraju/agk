# agk configuration for this repository. Read by the checks before pyproject.toml [tool.agk].
# The kit version this repository ships: equal to kit_version in kit/manifest.json (a test checks it); every kit bump updates both.
version = "0.63.0"
default_branch = "main"
test_dirs = ["tests"]
lint_paths = ["scripts/agk", "tests", ".claude/hooks"]
# The project's own tests (run by agk-project-test and by the proof check): the kit tests, exactly as agk-test collects them.
# The proof job installs no toolchain (SPEC-0010 rule 16), so the command installs pytest and ruff when either is missing
# (the kit tests that run the installed governance steps in a target run its lint step).
project_tests = "(python3 -m pytest --version && ruff --version) >/dev/null 2>&1 || python3 -m pip install -q pytest ruff; AGK_KIT_TESTS=1 python3 -m pytest -c tests/kit/pytest.ini tests/kit tests/kit_dev -q"
# Seconds a proof or prepush test run may take: the measured full suite (1161 s) with 1.5x headroom (SPEC-0044 rule 9, ADR-0282). A change needs an ADR.
proof_timeout = 1800
# Optional cleanup commands of the weekly drift audit, empty (off) by default; the kit ships no tool and installs none.
# unused_code prints one finding per line (for example "vulture . --min-confidence 80" or "npx knip");
# coverage prints the covered percentage as a number on its last line. Both are listed, never blocking; a change needs an ADR.
# This repository turns both on (ADR-0290, brief #593): vulture over the code and the hooks, installed first when missing
# (the drift-audit job installs no toolchain); coverage of scripts/agk under a named part of the kit suite (checks, route,
# drift, core, reviewers and session tests, about 310 s measured, inside proof_timeout; the full suite alone takes 1161 s).
unused_code = 'python3 -m vulture --version >/dev/null 2>&1 || python3 -m pip install -q vulture==2.16; python3 -m vulture scripts/agk .claude/hooks --min-confidence 80'
coverage = '(python3 -m coverage --version && python3 -m pytest --version && ruff --version) >/dev/null 2>&1 || python3 -m pip install -q coverage==7.17.2 pytest==9.1.1 ruff==0.16.9; export COVERAGE_FILE="${TMPDIR:-/tmp}/agk-coverage"; rm -f "$COVERAGE_FILE"; AGK_KIT_TESTS=1 python3 -m coverage run --source=scripts/agk -m pytest -q -c tests/kit/pytest.ini tests/kit/test_check_*.py tests/kit/test_route*.py tests/kit/test_drift*.py tests/kit/test_core_*.py tests/kit/test_reviewers*.py tests/kit/test_session*.py >/dev/null 2>&1; python3 -m coverage report --format=total'
# Every criterion ACn of a done requirement needs a REQ-nnn ACn test marker (SPEC-0010).
ac_coverage = "block"
experimental_reviewer = true
# One open pull request per person (strict) or any number with Depends-on (flow); a change of mode needs an ADR in the same pull request.
pr_mode = "flow"
# The checks the router judges a pull request (and the default branch) by: the latest run of each listed check, and the latest status of each listed context. A check that is not listed (a preview build of a hosting service, say) never labels a pull request red; a listed check that has not reported keeps it running. A change needs an ADR.
required_checks = ["proof", "governance"]
# The GitHub Apps an agent posts through (slugs). A comment GitHub records as posted through one of them never counts as a person's approval, and while the list is not empty a review never counts either (a review shows no app); a project that wants reviews to count sets an empty list. A change needs an ADR.
agent_apps = ["claude"]
# Who reviews a pull request: "team" (the default: a verdict by a listed author, and a separate Approve: by a spec approver) or "solo"
# (one person: one confirmation comment, whose text a session prints and the person posts from the browser or the GitHub app, never a
# session, counts as the verdict, its Final lines and the spec approval of the head it names; refused when config/reviewers.yaml lists
# nobody or more than one person). A change needs an ADR.
review_mode = "team"
# From this date an item of a `Verdict: fix list` that does not end with `(rule: <file> <n>)` or `(rule: none)` fails
# check_final_clearance.py; before it the check warns, and without the setting it only warns (brief #647, ADR-0310).
rule_tags_from = "2026-12-06"
# The data guard (SPEC-0042 rule 1, brief #589): always on; no key turns it off or removes a built-in rule. The [guard] table may only add:
# patterns (detector kinds CUSTOM-<name>), deny_paths (globs added to the secret files), deny_commands (added to the log commands),
# allowed_hosts (added to the local hosts), and allow_paths, the one escape: one relative file with a reason, never a built-in secret
# file, which the hook reads itself and allows only clean. An allow_paths or allowed_hosts entry counts only when it is also in agk.toml
# on the default branch. Any other key or value is refused, naming the setting. A change needs an ADR (agk.toml is protected).
# [guard]
# patterns = [{ name = "employee", regex = "EMP-\\d{5}" }]
# deny_paths = ["*.sqlite"]
# deny_commands = ["tail-prod"]
# allowed_hosts = ["db.internal.example.com"]
# allow_paths = [{ path = "docs/logs/README.md", reason = "a guide about logs, not a log" }]
# Who hands a finished builder its next work: "conductor" (the session asks on the agk-conductor issue and waits for an Assign: line) or "next" (session.py next, for setups with no conductor); a change needs an ADR.
[flow]
assign = "conductor"
# auto_merge and auto_merge_method (SPEC-0039 rule 1): off by default and when absent; only auto_merge = true with
# auto_merge_method = "squash", read from the default branch, lets merge_cleared.py merge. This repository turns it on by the
# owner's choice, ADR-0266; turning it off is again the owner's change, by an ADR in the same pull request.
auto_merge = true
auto_merge_method = "squash"
# The builder capacity (SPEC-0034 rule 1): nine builder sessions at once, by the owner's choice on 2026-11-08 (plan #661, ADR-0341).
max_builders = 9
# How a builder starts (SPEC-0034, brief #776, ADR-0402): "assign" means no session starts one; each slot runs from four staggered
# scheduled starts an hour (`doctor.py` prints them and warns of a slot with none) and the conductor posts `Assign:` lines.
builder_start = "assign"
# The conductor's review capacity (SPEC-0034 rule 15): equal to max_builders, the default when unset (brief #842, ADR-0384).
reviews_in_flight = 9
# The conductor lease (ADR-0330): one live conductor at a time, marked on the plan issue; merge-queue refuses while another holds it (ADR-0353).
plan_issue = 661
# The heavy-run queue (SPEC-0040 rule 1, brief #529): off by default and when absent. This repository keeps it off; turning it on is the
# owner's change, by an ADR in the same pull request.
# [locks]
# queue = false
# queue_order = "fifo"
# queue_max_wait = 120
# The work type (SPEC-0038 rule 5, REQ-045): `[delivery] work_type` selects a delivery playbook. This repository declares no work
# type (SPEC-0038 rule 12 (b)); declaring one is the owner's change, by an ADR in the same pull request, and a session never writes it.
# [delivery]
# work_type = "web-app"
# Intelligent testing (brief #578, ADR-0285; the owner's decision of 2026-11-05): a builder's prepush runs a change's own tests
# and the tests its change can affect, while a push to main and a release run the full suite. `balanced`: a changed file that no
# entry covers selects the tests that name it, and makes the selection full only when no test names it (SPEC-0055 rule 6). `pr_tests = "selected"` is the owner's setting; this repository's `Project tests` step
# stays skipped (kit/agk-kit.mk), so its pull requests' CI still runs the full suite as "Tests of the checks". `always_full` is
# the test system's own files only (brief #878, ADR-0393); any other entry needs an adjacent `# full: <reason>` comment. A
# core script selects its map entry's tests and the tests of the files that import it. The map was built from the code: each test file under tests/kit/ and tests/kit_dev/ that imports a script or names it
# as `<script>.py`, closed over the scripts' own imports. A change of any of this needs an ADR (agk.toml is protected).
[testing]
map_source = "curated"
# merge_cleared.py runs these on the would-be merge after governance (brief #667, ADR-0320)
pre_merge_tests = ["tests/kit/test_rule_budget.py", "tests/kit_dev/test_intelligent_testing.py", "tests/kit_dev/test_kit_manifest.py"]
profile = "balanced"
pr_tests = "selected"
# The full suite in parallel workers where the interpreter imports xdist (brief #631, ADR-0305).
workers = "auto"
always_full = [
  "tests/kit/conftest.py", "tests/kit/pytest.ini", "tests/kit_dev/conftest.py", "Makefile", "agk.mk", "kit/agk-kit.mk",
  ".github/workflows/**", "scripts/agk/common.py", "scripts/agk/impact.py",
]
