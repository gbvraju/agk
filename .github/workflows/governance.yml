name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:

permissions:
  contents: read

jobs:
  governance:
    if: ${{ github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install pytest ruff
      - name: Governance checks
        env:
          AGK_BASE: ${{ github.event.pull_request.base.sha }}
        run: make -f agk.mk agk-governance
      - name: PR body shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | python scripts/agk/check_pr_body.py -
      - name: Lint
        run: make -f agk.mk agk-lint
      - name: Tests of the checks
        run: make -f agk.mk agk-test
      - name: Project tests
        run: make -f agk.mk agk-project-test
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
