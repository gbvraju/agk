# One step per governance check, each named by its check id (SPEC-0007 rule 13); the job name `governance` is the
# required status check and does not change. Each check step runs unless the run is cancelled, so every failure shows
# on its own step; the job still fails if any step fails. From `PR body file` on, every step runs unless the run is
# cancelled (brief #261): a failed body step hides no lint, test or scan, and an edit cures only a run that reached them. The same checks run locally as `make -f agk.mk agk-governance`.
name: governance

# A run for an edited description is named `governance edited`, every other one `governance full`: the first step of the partial run reads
# the latest completed full run of the head by that name (brief #216), so that a partial run cannot turn a failed full run green.
run-name: governance ${{ github.event.action == 'edited' && 'edited' || 'full' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
  # The merger job (brief #765, ADR-0354): a `Verdict:` or `Approve:` comment, the green `governance` job of a ready pull
  # request (`needs`) or a green proof run of its head starts it (a workflow cannot start itself by `workflow_run`); after a
  # merge by the job's own token it dispatches the default branch's run, which that merge cannot start.
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [proof]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

# CI runs only where it can change a result (brief #216): a superseded run of a pull request is cancelled, a running push to the
# default branch never is (a waiting one is replaced by a newer push, brief #621), and a run for an edited description has a group of its own so that it cannot cancel the full run of the same commit. On an
# edited description only the steps that read the pull request body run (those without the condition `github.event.action != 'edited'`);
# the job and its name stay, so the required check still reports.
# Fast CI (brief #283): on a draft pull request the heavy steps (lint, the tests, the project tests) are skipped and the job
# still reports, and `ready_for_review` runs them in full; a superseded run is cancelled by the concurrency group below. The
# secret scanner's download is kept in a cache; the tooling install (two small packages) is not cached. A documentation-only
# change still runs every check, since the checks read the documentation. Nothing is uploaded, so no retention applies.
# Main checks run in batches (brief #621, ADR-0302): every push to the default branch shares one fixed group, so a running push run
# is never cancelled (a run 80% done finishes) and pushes that arrive meanwhile wait as one run: GitHub keeps one running and at
# most one waiting run per group and replaces an older waiting run with the newer one, which checks the newest commit and so every
# change before it. A commit whose waiting run was replaced is covered by the next completed full run that contains it.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && format('governance-{0}-code', github.ref_name) || github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && format('governance-{0}-code', github.ref_name) || (github.event_name == 'issue_comment' || github.event_name == 'workflow_run') && format('governance-merger-{0}', github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.sha) || format('governance-{0}-{1}', github.event.pull_request.number || github.sha, github.event.action == 'edited' && 'edited' || 'code') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    # Never on the merger job's events (brief #765): the required check runs on pull requests, pushes and a dispatch.
    if: ${{ github.event_name != 'issue_comment' && github.event_name != 'workflow_run' && (github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - name: Base of the merge ref
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # GitHub checks out a merge of the current base branch and the head; the event's base sha can be older
          # than that first parent, and a check would then count what other pull requests merged in the meantime.
          # This step is the only place that sets AGK_BASE: the first parent of a merge checkout, else the event's.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$EVENT_BASE"
          fi
          if [ -n "$base" ]; then
            echo "AGK_BASE=$base" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Paused
        id: paused
        run: |
          # Brief #348 (ADR-0196): while agk.toml sets `paused = true` the job prints one line and every later step is skipped, so
          # the required check reports success. A pull request is judged by its base (AGK_BASE), never by its head: the pull
          # request that adds the line is still checked in full, its ADR included. A push reads the commit pushed. A value that
          # is not true or false fails this step, with the refusal (it names the setting, never the value).
          if [ -n "${AGK_BASE:-}" ]; then
            state="$(python3 scripts/agk/doctor.py --paused --ref "$AGK_BASE")" || { echo "$state"; exit 1; }
          else
            state="$(python3 scripts/agk/doctor.py --paused)" || { echo "$state"; exit 1; }
          fi
          if [ "$state" = "agk paused" ]; then
            echo "agk paused"
            echo "agk paused" >> "$GITHUB_STEP_SUMMARY"
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Status-only final commit
        id: status
        if: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # A draft pull request (brief #283): the same steps are skipped, and they run in full on `ready_for_review`.
          if [ "$PR_DRAFT" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "governance skipped the lint, the tests of the checks, the project tests and the kit tests of the checks on a draft pull request; they run in full when it is marked ready for review" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The same decision as proof (scripts/agk/status_only.py, brief #234): the head is one commit after its parent, the
          # commit changes only status lines, the full governance run of the parent passed, and the default branch has not
          # moved past the parent. Then the steps whose inputs a status line cannot change are skipped (the `if` of each).
          parent="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
          conclusion=""
          parent_run=""
          if [ -n "$parent" ]; then
            gh api --method GET "repos/${{ github.repository }}/actions/runs?head_sha=$parent&event=pull_request&per_page=100" > "$RUNNER_TEMP/parent-runs.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/parent-runs.json"
            pick='[.workflow_runs[]? | select(.display_title == "governance full")] | sort_by(.created_at) | last'
            conclusion="$(jq -r "$pick | .conclusion // \"\"" "$RUNNER_TEMP/parent-runs.json" 2>/dev/null || true)"
            parent_run="$(jq -r "$pick | .html_url // \"\"" "$RUNNER_TEMP/parent-runs.json" 2>/dev/null || true)"
          fi
          verdict="$(python scripts/agk/status_only.py --head "$HEAD_SHA" --parent-governance "$conclusion" || echo 'run (the decision failed)')"
          echo "$verdict"
          if [ "$verdict" = skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "governance skipped the lint, the tests of the checks, the project tests and the kit tests of the checks: only status lines changed and the full run of the parent passed ($parent_run)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Latest full run
        if: ${{ github.event.action == 'edited' && steps.paused.outputs.paused != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The required check reads the latest governance run of the head: a partial run must not turn a failed full run green.
          # A full run still queued or in progress is waited for: the same GET every 30 seconds, at most 20 minutes.
          # A red full run passes only when every failed step of it reads the body (brief #216, build b): one more GET of its jobs.
          for attempt in $(seq 0 40); do
            gh api --method GET "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.event.pull_request.head.sha }}&event=pull_request&per_page=100" > "$RUNNER_TEMP/runs.json" || : > "$RUNNER_TEMP/runs.json"
            code=0
            out="$(python scripts/agk/full_run.py --runs "$RUNNER_TEMP/runs.json" --head "${{ github.event.pull_request.head.sha }}")" || code=$?
            echo "$out"
            if [ "$code" -eq 4 ]; then
              gh api --method GET "repos/${{ github.repository }}/actions/runs/${out#jobs }/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json" || : > "$RUNNER_TEMP/jobs.json"
              code=0
              python scripts/agk/full_run.py --runs "$RUNNER_TEMP/runs.json" --head "${{ github.event.pull_request.head.sha }}" --jobs "$RUNNER_TEMP/jobs.json" || code=$?
            fi
            [ "$code" -ne 3 ] && exit "$code"
            [ "$attempt" -lt 40 ] && sleep 30
          done
          echo "rule 2: the full governance run of the head did not finish in 20 minutes"
          exit 1
      - name: Install tooling
        if: ${{ github.event.action != 'edited' && steps.status.outputs.skip != 'true' && steps.paused.outputs.paused != 'true' }}
        run: |
          # The tools are pinned in config/ci-tools.txt (brief #698, ADR-0328): bandit runs the scanner hygiene test (ADR-0192),
          # pytest-xdist the full suite in workers (`[testing] workers`). A tool that cannot be installed fails this step by
          # name: the checks that need it are never skipped. An update changes the pin file only.
          python -m pip install -r config/ci-tools.txt || echo "Install tooling: pip reported an error; checking each tool"
          for tool in pytest ruff bandit; do
            python -m "$tool" --version > /dev/null 2>&1 || { echo "Install tooling: $tool could not be installed"; exit 1; }
          done
          python -c "import xdist" > /dev/null 2>&1 || { echo "Install tooling: pytest-xdist could not be installed"; exit 1; }
      - name: PR body file
        # Written unless the run is cancelled (brief #349): after a failed `Latest full run` the body steps still read it.
        if: ${{ !cancelled() && steps.paused.outputs.paused != 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: PR comments
        if: ${{ !cancelled() && steps.paused.outputs.paused != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate --method GET "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" > "$RUNNER_TEMP/comments.json"
            gh api --paginate --method GET "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" > "$RUNNER_TEMP/reviews.json"
            # The server-side time of each push (a pull_request run) pins an `Approve: SPEC-<n>` comment to the head it saw (SPEC-0032 rule 5).
            gh api --paginate --method GET "repos/${{ github.repository }}/actions/runs?event=pull_request&branch=$HEAD_REF&per_page=100" > "$RUNNER_TEMP/approval-runs.json" || echo '[]' > "$RUNNER_TEMP/approval-runs.json"
          else
            echo '[]' > "$RUNNER_TEMP/comments.json"
            echo '[]' > "$RUNNER_TEMP/reviews.json"
            echo '[]' > "$RUNNER_TEMP/approval-runs.json"
          fi
      - name: PR states and open pull requests
        if: ${{ !cancelled() && steps.paused.outputs.paused != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          : > "$RUNNER_TEMP/states.json"
          echo '[]' > "$RUNNER_TEMP/open-prs.json"
          if [ "$EVENT" = pull_request ]; then
            for n in $(python scripts/agk/check_pr_mode.py --list-depends --body "$RUNNER_TEMP/pr-body.md"); do
              # The issues endpoint answers for a pull request and for a brief issue alike (brief #282).
              gh api --method GET "repos/${{ github.repository }}/issues/$n" --jq '{number: .number, pull_request: (.pull_request != null), merged: (.pull_request.merged_at != null), state: .state, state_reason: .state_reason}' >> "$RUNNER_TEMP/states.json" || echo "{\"number\": $n, \"merged\": false}" >> "$RUNNER_TEMP/states.json"
            done
            gh api --paginate --method GET "repos/${{ github.repository }}/pulls?state=open&per_page=100" --jq ".[] | select(.user.login == \"$PR_AUTHOR\") | {number: .number}" > "$RUNNER_TEMP/open-prs.json"
          fi
      - name: Record comments
        # The Final comment of each record line (SPEC-0021 rule 3a, brief #557): the release check and the release
        # exemption of check_protected_changes count a record only once its comment verifies it. A comment that
        # cannot be read is left out, so its record counts for nothing (fail closed).
        if: ${{ !cancelled() && steps.paused.outputs.paused != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/record-comments.json"
          if [ -f kit/agk-kit.mk ]; then
            for id in $(python scripts/agk/check_adrs.py --record-ids); do
              gh api --method GET "repos/${{ github.repository }}/issues/comments/$id" >> "$RUNNER_TEMP/record-comments.json" || echo "Record comments: comment $id could not be read"
            done
          fi
      - name: check_protected_changes
        # Reads the body's `Covered-by:` line (brief #545, ADR-0271), so it runs on an edited description too.
        if: ${{ !cancelled() && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_protected_changes.py --body "$RUNNER_TEMP/pr-body.md" --comments "$RUNNER_TEMP/record-comments.json"
      - name: check_requirements
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_requirements.py
      - name: check_adrs
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_adrs.py
      - name: check_numbers
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_numbers.py
      - name: check_specs
        if: ${{ !cancelled() && steps.paused.outputs.paused != 'true' }}
        # On a push there is no base ref and the check is skipped, so the saved comments are the pull request's.
        run: python scripts/agk/check_specs.py --body "$RUNNER_TEMP/pr-body.md" --comments "$RUNNER_TEMP/comments.json" --reviews "$RUNNER_TEMP/reviews.json" --runs "$RUNNER_TEMP/approval-runs.json"
      - name: check_neutrality
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_neutrality.py
      - name: check_build_state
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_build_state.py
      - name: check_kit_tests
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.status.outputs.skip != 'true' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_kit_tests.py
      - name: check_design
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_design.py
      - name: check_playbooks
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_playbooks.py
      - name: reviewers --check
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/reviewers.py --check
      - name: reviewers --check-codeowners
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/reviewers.py --check-codeowners
      - name: check_pr_mode
        if: ${{ !cancelled() && steps.paused.outputs.paused != 'true' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/agk/check_pr_mode.py --body "$RUNNER_TEMP/pr-body.md" --states "$RUNNER_TEMP/states.json" --open "$RUNNER_TEMP/open-prs.json" --number "$PR_NUMBER"
      - name: check_final_clearance
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python scripts/agk/check_final_clearance.py --comments "$RUNNER_TEMP/comments.json" --reviews "$RUNNER_TEMP/reviews.json" --head "$HEAD_SHA" --author "$PR_AUTHOR" --draft "$PR_DRAFT"
      # The release pull request check is a kit script (SPEC-0028): it runs where the kit's own suite is installed.
      - name: Release check
        if: ${{ !cancelled() && hashFiles('kit/agk-kit.mk') != '' && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        run: python scripts/agk/check_release.py --comments "$RUNNER_TEMP/record-comments.json"
      - name: Open briefs
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.paused.outputs.paused != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method GET "repos/${{ github.repository }}/issues?labels=agk-brief&state=open&per_page=100" > "$RUNNER_TEMP/briefs.json"
      - name: PR body shape
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.paused.outputs.paused != 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: printf '%s\n' "$PR_BODY" | python scripts/agk/check_pr_body.py --draft "$PR_DRAFT" --issues "$RUNNER_TEMP/briefs.json" -
      - name: Lint
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.status.outputs.skip != 'true' && steps.paused.outputs.paused != 'true' }}
        run: make -f agk.mk agk-lint
      - name: Tests of the checks
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.status.outputs.skip != 'true' && steps.paused.outputs.paused != 'true' }}
        env:
          # With `[testing] pr_tests = "selected"` a pull request of the kit runs only its selected tests, by the plan of
          # `Project tests` against AGK_BASE (set above); a push and a release run the full suite (brief #749, ADR-0348).
          EVENT: ${{ github.event_name }}
        run: make -f agk.mk agk-test
      # The kit repository runs its own suite as "Tests of the checks" and its `project_tests` is that same suite
      # (the proof job runs it); there the step is skipped. In a project kit/agk-kit.mk is absent and the step runs.
      - name: Restore the secret scanner
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        env:
          # The same pins as the step `Secret scan`; a test keeps the two equal.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        with:
          # The archive of the step `Secret scan`, keyed on its pinned version and digest (brief #275, ADR-0171). The action
          # restores it here and saves the directory at the end of a job that succeeded; the scan checks the digest on use.
          path: ${{ runner.temp }}/gitleaks-cache
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Project tests
        if: ${{ !cancelled() && hashFiles('kit/agk-kit.mk') == '' && github.event.action != 'edited' && steps.status.outputs.skip != 'true' && steps.paused.outputs.paused != 'true' }}
        env:
          # With `[testing] pr_tests = "selected"` a pull request runs only the selected tests; a push and a release pull
          # request run the full suite (brief #453, ADR-0242). Without the setting the step runs the full suite as before.
          EVENT: ${{ github.event_name }}
        run: make -f agk.mk agk-project-test
      - name: Secret scan
        if: ${{ !cancelled() && github.event.action != 'edited' && steps.paused.outputs.paused != 'true' }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The open-source gitleaks binary, not its action, which needs a licence key on a repository owned by an organisation
          # (brief #258, ADR-0158); no secret and no permission beyond the job's.
          # 1. One pinned release of the official binary for linux x64; a digest that differs from the one above fails the step.
          # The step `Restore the secret scanner` restores a copy keyed on the version and the digest (brief #275, ADR-0171);
          # it is used only when it matches the digest, else it is discarded and the archive is downloaded. A download that
          # fails prints one plain line and fails the step: the scan is never skipped.
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cache="$RUNNER_TEMP/gitleaks-cache"
          mkdir -p "$cache"
          if [ -f "$cache/$archive" ] && echo "$GITLEAKS_SHA256  $cache/$archive" | sha256sum --check --strict --status; then
            echo "secret scanner: the cached copy of $archive"
            cp "$cache/$archive" "$RUNNER_TEMP/$archive"
          else
            if [ -f "$cache/$archive" ]; then
              echo "secret scanner: the cached copy does not match the digest; downloading it again"
              rm -f "$cache/$archive"
            fi
            code="$(curl -sL --retry 3 -o "$RUNNER_TEMP/$archive" -w '%{http_code}' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" 2>/dev/null)" || true
            if [ "$code" != 200 ]; then
              echo "could not download the secret scanner from GitHub (HTTP ${code:-000}); re-run the job"
              exit 1
            fi
          fi
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          # Only a verified archive is left in the directory that the cache action saves after a job that succeeded.
          cp -f "$RUNNER_TEMP/$archive" "$cache/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          # 2. The commits of the change: on a pull request the merge base to the head; on a push the pushed range; on the first
          # push of a repository (or a `before` that is not in the history) the whole history. Any finding fails the step.
          if [ "$EVENT" = pull_request ] && [ -n "${AGK_BASE:-}" ]; then
            range="$(git merge-base "$AGK_BASE" "$HEAD_SHA")..$HEAD_SHA"
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$range" .

  # The merger job of GitHub mode (brief #765, ADR-0354, amendment 139 to SPEC-0039): it checks out the default branch,
  # never a pull request's head, and runs merge_cleared.py with the job's own token; its one merge call runs under the
  # secret `AGK_MERGE_TOKEN`, which only the second step receives (without it: one line, and nothing else). `--event`
  # prints `<n> <sha>` only when `[flow] auto_merge = true`, the project is not in local or personal mode and the latest
  # verdict clears that head; then the guarded command runs exactly, with every re-check its own, and `--report` posts
  # one comment for a hold or a refusal. No retry loop.
  merger:
    needs: governance
    if: ${{ !cancelled() && ((github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, 'Verdict:') || startsWith(github.event.comment.body, 'Approve:'))) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request' && github.event.action != 'edited' && !github.event.pull_request.draft && needs.governance.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Find a cleared pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A default branch whose merge_cleared.py predates the merger mode refuses `--event`: nothing to do.
          target="$(python3 scripts/agk/merge_cleared.py --event "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME")" \
            || { echo "merger: the default branch has no merger mode yet"; exit 0; }
          [ -n "$target" ] || exit 0
          # The pre-merge tests of `[testing] pre_merge_tests` need the pinned test tools (config/ci-tools.txt).
          # Every command here ends green: a red merger would turn the run that `Latest full run` reads red.
          python -m pip install -q -r config/ci-tools.txt || echo "merger: the test tools could not be installed"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Merge a cleared pull request
        if: ${{ steps.find.outputs.target != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AGK_MERGE_TOKEN: ${{ secrets.AGK_MERGE_TOKEN }}
          TARGET: ${{ steps.find.outputs.target }}
        run: |
          set -- $TARGET
          if [ -z "$AGK_MERGE_TOKEN" ]; then
            python3 scripts/agk/merge_cleared.py --report --pr "$1" --no-secret || echo "merger: no report"
            exit 0
          fi
          line="$(python3 scripts/agk/merge_cleared.py --pr "$1" --sha "$2")" || true
          echo "$line"
          python3 scripts/agk/merge_cleared.py --report --pr "$1" --sha "$2" --line "$line" || echo "merger: no report"
