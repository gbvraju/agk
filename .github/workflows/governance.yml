# One step per governance check, each named by its check id (SPEC-0007 rule 13); the job name `governance` is the
# required status check and does not change. Each check step runs unless the run is cancelled, so every failure shows
# on its own step; the job still fails if any step fails. The same checks run locally as `make -f agk.mk agk-governance`.
name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:

permissions:
  contents: read

jobs:
  governance:
    if: ${{ github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    env:
      AGK_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install pytest ruff
      - name: check_protected_changes
        if: ${{ !cancelled() }}
        run: python scripts/agk/check_protected_changes.py
      - name: check_requirements
        if: ${{ !cancelled() }}
        run: python scripts/agk/check_requirements.py
      - name: check_adrs
        if: ${{ !cancelled() }}
        run: python scripts/agk/check_adrs.py
      - name: check_specs
        if: ${{ !cancelled() }}
        run: python scripts/agk/check_specs.py
      - name: check_neutrality
        if: ${{ !cancelled() }}
        run: python scripts/agk/check_neutrality.py
      - name: check_build_state
        if: ${{ !cancelled() }}
        run: python scripts/agk/check_build_state.py
      - name: check_kit_tests
        if: ${{ !cancelled() }}
        run: python scripts/agk/check_kit_tests.py
      - name: reviewers --check
        if: ${{ !cancelled() }}
        run: python scripts/agk/reviewers.py --check
      - name: reviewers --check-codeowners
        if: ${{ !cancelled() }}
        run: python scripts/agk/reviewers.py --check-codeowners
      - name: PR body shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | python scripts/agk/check_pr_body.py -
      - name: Lint
        run: make -f agk.mk agk-lint
      - name: Tests of the checks
        run: make -f agk.mk agk-test
      - name: Project tests
        run: make -f agk.mk agk-project-test
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
