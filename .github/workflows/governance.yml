# One step per governance check, each named by its check id (SPEC-0007 rule 13); the job name `governance` is the
# required status check and does not change. Each check step runs unless the run is cancelled, so every failure shows
# on its own step; the job still fails if any step fails. The same checks run locally as `make -f agk.mk agk-governance`.
name: governance

# A run for an edited description is named `governance edited`, every other one `governance full`: the first step of the partial run reads
# the latest completed full run of the head by that name (brief #216), so that a partial run cannot turn a failed full run green.
run-name: governance ${{ github.event.action == 'edited' && 'edited' || 'full' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

# CI runs only where it can change a result (brief #216): a superseded run of a pull request is cancelled, a push to the default branch
# never is, and a run for an edited description has a group of its own so that it cannot cancel the full run of the same commit. On an
# edited description only the steps that read the pull request body run (those without the condition `github.event.action != 'edited'`);
# the job and its name stay, so the required check still reports.
concurrency:
  group: governance-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    if: ${{ github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - name: Base of the merge ref
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # GitHub checks out a merge of the current base branch and the head; the event's base sha can be older
          # than that first parent, and a check would then count what other pull requests merged in the meantime.
          # This step is the only place that sets AGK_BASE: the first parent of a merge checkout, else the event's.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$EVENT_BASE"
          fi
          if [ -n "$base" ]; then
            echo "AGK_BASE=$base" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Latest full run
        if: ${{ github.event.action == 'edited' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The required check reads the latest governance run of the head: a partial run must not turn a failed full run green.
          # A full run still queued or in progress is waited for: the same GET every 30 seconds, at most 20 minutes.
          for attempt in $(seq 0 40); do
            gh api --method GET "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.event.pull_request.head.sha }}&event=pull_request&per_page=100" > "$RUNNER_TEMP/runs.json" || : > "$RUNNER_TEMP/runs.json"
            code=0
            python scripts/agk/full_run.py --runs "$RUNNER_TEMP/runs.json" --head "${{ github.event.pull_request.head.sha }}" || code=$?
            [ "$code" -ne 3 ] && exit "$code"
            [ "$attempt" -lt 40 ] && sleep 30
          done
          echo "rule 2: the full governance run of the head did not finish in 20 minutes"
          exit 1
      - name: Install tooling
        if: ${{ github.event.action != 'edited' }}
        run: python -m pip install pytest ruff
      - name: PR body file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate --method GET "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" > "$RUNNER_TEMP/comments.json"
            gh api --paginate --method GET "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" > "$RUNNER_TEMP/reviews.json"
          else
            echo '[]' > "$RUNNER_TEMP/comments.json"
            echo '[]' > "$RUNNER_TEMP/reviews.json"
          fi
      - name: PR states and open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          : > "$RUNNER_TEMP/states.json"
          echo '[]' > "$RUNNER_TEMP/open-prs.json"
          if [ "$EVENT" = pull_request ]; then
            for n in $(python scripts/agk/check_pr_mode.py --list-depends --body "$RUNNER_TEMP/pr-body.md"); do
              gh api --method GET "repos/${{ github.repository }}/pulls/$n" --jq '{number: .number, merged: .merged}' >> "$RUNNER_TEMP/states.json" || echo "{\"number\": $n, \"merged\": false}" >> "$RUNNER_TEMP/states.json"
            done
            gh api --paginate --method GET "repos/${{ github.repository }}/pulls?state=open&per_page=100" --jq ".[] | select(.user.login == \"$PR_AUTHOR\") | {number: .number}" > "$RUNNER_TEMP/open-prs.json"
          fi
      - name: check_protected_changes
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/check_protected_changes.py
      - name: check_requirements
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/check_requirements.py
      - name: check_adrs
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/check_adrs.py
      - name: check_numbers
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/check_numbers.py
      - name: check_specs
        if: ${{ !cancelled() }}
        # On a push there is no base ref and the check is skipped, so the saved comments are the pull request's.
        run: python scripts/agk/check_specs.py --body "$RUNNER_TEMP/pr-body.md" --comments "$RUNNER_TEMP/comments.json" --reviews "$RUNNER_TEMP/reviews.json"
      - name: check_neutrality
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/check_neutrality.py
      - name: check_build_state
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/check_build_state.py
      - name: check_kit_tests
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/check_kit_tests.py
      - name: check_design
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/check_design.py
      - name: reviewers --check
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/reviewers.py --check
      - name: reviewers --check-codeowners
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: python scripts/agk/reviewers.py --check-codeowners
      - name: check_pr_mode
        if: ${{ !cancelled() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/agk/check_pr_mode.py --body "$RUNNER_TEMP/pr-body.md" --states "$RUNNER_TEMP/states.json" --open "$RUNNER_TEMP/open-prs.json" --number "$PR_NUMBER"
      - name: check_final_clearance
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python scripts/agk/check_final_clearance.py --comments "$RUNNER_TEMP/comments.json" --reviews "$RUNNER_TEMP/reviews.json" --head "$HEAD_SHA" --author "$PR_AUTHOR" --draft "$PR_DRAFT"
      # The release pull request check is a kit script (SPEC-0028): it runs where the kit's own suite is installed.
      - name: Release check
        if: ${{ !cancelled() && hashFiles('kit/agk-kit.mk') != '' && github.event.action != 'edited' }}
        run: python scripts/agk/check_release.py
      - name: Open briefs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method GET "repos/${{ github.repository }}/issues?labels=agk-brief&state=open&per_page=1" > "$RUNNER_TEMP/briefs.json"
      - name: PR body shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: printf '%s\n' "$PR_BODY" | python scripts/agk/check_pr_body.py --draft "$PR_DRAFT" --issues "$RUNNER_TEMP/briefs.json" -
      - name: Lint
        if: ${{ github.event.action != 'edited' }}
        run: make -f agk.mk agk-lint
      - name: Tests of the checks
        if: ${{ github.event.action != 'edited' }}
        run: make -f agk.mk agk-test
      # The kit repository runs its own suite as "Tests of the checks" and its `project_tests` is that same suite
      # (the proof job runs it); there the step is skipped. In a project kit/agk-kit.mk is absent and the step runs.
      - name: Project tests
        if: ${{ hashFiles('kit/agk-kit.mk') == '' && github.event.action != 'edited' }}
        run: make -f agk.mk agk-project-test
      - name: Secret scan
        if: ${{ github.event.action != 'edited' }}
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
