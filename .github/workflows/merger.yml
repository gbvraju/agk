# The merger job (SPEC-0039 rule 2, brief #765, ADR-0354): in GitHub mode with `[flow] auto_merge = true`, it runs the one
# guarded command on a cleared head with no session. It starts only on `issue_comment`, `workflow_run` and `status`, which GitHub
# always runs from this file on the default branch, never from a pull request's copy; no pull request's run can start it. Its
# token writes only comments. The merge is made by `AGK_MERGE_TOKEN`, a secret of the `merge` environment, whose deployment
# branches are the default branch alone, so that a run of any other ref cannot read it. The push of that merge starts the
# default branch's own governance run. Without the secret the job posts one line and does nothing else.
# Fast CI (brief #283): a draft starts a job only by a comment or a green run, and the guarded command holds a draft; the concurrency
# group is one per pull request and never cancels a run that may be merging. Nothing is cached or uploaded, so no retention applies, and
# a documentation-only change merges like any other.
# The sweep (SPEC-0039 rule 2, brief #797, ADR-0373): a clearing event that fell in an outage is never sent again, so every 15 minutes,
# or by hand, the jobs `sweep-gate` (no secret, reads the settings) and `sweep` run the same guarded merge on the open cleared pull
# requests. A project without `[flow] auto_merge = true`, or in local or personal mode, stops at the gate and opens no `merge` environment.
# Brief #836 (ADR-0383): an edited `Verdict:`, `Final:` or `Approve:` comment starts the job too, and every finished `governance` or
# `proof` run also sweeps, after the event job: GitHub drops scheduled runs under load, so the schedule is only a fallback. The sweep
# picks pull requests by their cleared verdict, never by label. A skipped ancestor skips a job unless its `if` says otherwise, hence
# `!cancelled()` on both sweep jobs; the sweep has its own group because each finished run's group is per pull request.
# Brief #853 (ADR-0387): the commit status `agk/verdict` with `success` starts the job too, a condition of this job and no new one; the
# status only starts it, and the guarded command reads the verdict again. A verdict or an approval sets the status first, so the job's
# token writes statuses as well as comments. A status event never sweeps, and nothing the job sets starts a run.
# Brief #972 (ADR-0417, amendment 158): with `[flow] merge_queue = true` the guarded command adds a cleared head to GitHub's merge
# queue instead of merging it; this file calls it as before and the command decides. The merger job ends after 30 minutes, so a run
# that waits on the `merge` environment can never block every later run for hours (run 42669997036, 9 to 10 November). The job
# `queue-removed`, on a failed `governance` or `proof` run of `merge_group`, posts one line on the pull request the queue removed;
# it needs no secret and writes only that comment.
name: merger

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [governance, proof]
    types: [completed]
  status:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read
  checks: read
  statuses: write

concurrency:
  group: agk-merger-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.sha || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'sweep') || github.run_id }}
  cancel-in-progress: false

jobs:
  merger:
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, 'Verdict:') || startsWith(github.event.comment.body, 'Approve:') || (github.event.action == 'edited' && startsWith(github.event.comment.body, 'Final:')))) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'status' && github.event.context == 'agk/verdict' && github.event.state == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: merge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Set the verdict status
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/agk/merge_cleared.py --status --event "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME" || echo "merger: no status"
      - name: Find a cleared pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Every command here ends green: a run of this workflow reports on the default branch's head, not on a pull request's.
          target="$(python3 scripts/agk/merge_cleared.py --event "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME")" \
            || { echo "merger: no target could be read"; exit 0; }
          [ -n "$target" ] || exit 0
          # The pre-merge tests of `[testing] pre_merge_tests` need the pinned test tools (config/ci-tools.txt).
          python -m pip install -q -r config/ci-tools.txt || echo "merger: the test tools could not be installed"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Merge a cleared pull request
        if: ${{ steps.find.outputs.target != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AGK_MERGE_TOKEN: ${{ secrets.AGK_MERGE_TOKEN }}
          TARGET: ${{ steps.find.outputs.target }}
        run: |
          set -- $TARGET
          if [ -z "$AGK_MERGE_TOKEN" ]; then
            python3 scripts/agk/merge_cleared.py --report --pr "$1" --no-secret || echo "merger: no report"
            exit 0
          fi
          line="$(python3 scripts/agk/merge_cleared.py --pr "$1" --sha "$2")" || true
          echo "$line"
          python3 scripts/agk/merge_cleared.py --report --pr "$1" --sha "$2" --line "$line" || echo "merger: no report"

  queue-removed:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Report a pull request removed from the merge queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agk/merge_cleared.py --queue-removed --event "$GITHUB_EVENT_PATH" || echo "merger: no removal posted"

  sweep-gate:
    needs: merger
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') }}
    runs-on: ubuntu-latest
    outputs:
      sweep: ${{ steps.gate.outputs.sweep }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Read whether this project sweeps
        id: gate
        run: echo "sweep=$(python3 scripts/agk/merge_cleared.py --sweep-gate || echo off)" >> "$GITHUB_OUTPUT"

  sweep:
    needs: sweep-gate
    if: ${{ !cancelled() && needs.sweep-gate.outputs.sweep == 'on' }}
    concurrency:
      group: agk-merger-sweep-job
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: merge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the test tools
        run: |
          python -m pip install -q -r config/ci-tools.txt || echo "merger: the test tools could not be installed"
      - name: Sweep the open cleared pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          AGK_MERGE_TOKEN: ${{ secrets.AGK_MERGE_TOKEN }}
        run: |
          python3 scripts/agk/merge_cleared.py --sweep || echo "merger: the sweep ended early"
