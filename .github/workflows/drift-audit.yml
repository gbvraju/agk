# Weekly drift audit of the default branch (SPEC-0004). It runs on a schedule and by hand (workflow_dispatch).
# GitHub may disable scheduled workflows after a period of repository inactivity (the period is (verify) against
# current GitHub documentation). If scheduled runs stop, start this workflow by hand with workflow_dispatch.
# Its only writes: creating or updating the one open issue labelled agk-drift-audit, and creating that label.
# The report job runs the project's own optional commands (unused_code, coverage in agk.toml), so no writing token is
# reachable there: its checkout keeps no credentials and the report step has no GH_TOKEN. The file job, which runs no
# project command and checks nothing out, does the issue writes from the report handed on as a job output.
name: drift-audit

on:
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.audit.outputs.title }}
      action: ${{ steps.audit.outputs.action }}
      report: ${{ steps.audit.outputs.report }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the open audit issues (no project command runs in this step)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label agk-drift-audit --state open --json number --jq '.[].number' | tr '\n' ' ' > "$RUNNER_TEMP/open.txt"
          # The body of the lowest-numbered open audit issue: the previous report, for the coverage change (SPEC-0004 rule 25).
          gh issue list --label agk-drift-audit --state open --json number,body --jq 'sort_by(.number) | .[0].body // ""' > "$RUNNER_TEMP/previous.md"
      - name: Audit (no token in this step)
        id: audit
        shell: bash
        run: |
          today=$(date -u +%F)
          open=$(cat "$RUNNER_TEMP/open.txt")
          title=$(python3 scripts/agk/drift_audit.py --today "$today" --print-title)
          action=$(python3 scripts/agk/drift_audit.py --today "$today" --open-issues "$open" --print-action)
          python3 scripts/agk/drift_audit.py --today "$today" --open-issues "$open" --previous "$RUNNER_TEMP/previous.md" > "$RUNNER_TEMP/report.md"
          head -n 1 "$RUNNER_TEMP/report.md"
          {
            echo "title=$title"
            echo "action=$action"
            echo "report=$(base64 -w0 "$RUNNER_TEMP/report.md")"
          } >> "$GITHUB_OUTPUT"

  file:
    needs: report
    runs-on: ubuntu-latest
    steps:
      - name: File at most one issue (no checkout, no project command)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.report.outputs.title }}
          ACTION: ${{ needs.report.outputs.action }}
          REPORT: ${{ needs.report.outputs.report }}
        run: |
          printf '%s' "$REPORT" | base64 -d > "$RUNNER_TEMP/report.md"
          case "$ACTION" in
            create)
              gh label create agk-drift-audit --description "Weekly drift audit" --color d93f0b || true
              gh issue create --title "$TITLE" --label agk-drift-audit --body-file "$RUNNER_TEMP/report.md"
              ;;
            update\ *)
              number="${ACTION#update }"
              case "$number" in ''|*[!0-9]*) echo "unexpected action"; exit 1;; esac
              gh issue edit "$number" --title "$TITLE" --body-file "$RUNNER_TEMP/report.md"
              ;;
            *)
              echo "no findings; nothing written"
              ;;
          esac
