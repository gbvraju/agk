[project]
name = "{{project}}"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.agk]
version = "{{kit_version}}"
installed = "{{date}}"
# Directories scanned for REQ-nnn test markers (only files named test_*.py count).
test_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/agk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
