# agk configuration (adopted repository). Read by the checks.
mode = "adopt"
version = "{{kit_version}}"
installed = "{{date}}"
default_branch = "{{default_branch}}"
test_dirs = {{test_dirs}}
test_patterns = {{test_patterns}}
lint_paths = ["scripts/agk", ".claude/hooks"]
# The project runs its own tests in its own CI; agk-project-test only prints a notice.
project_tests = ""
# Optional cleanup commands of the weekly drift audit, empty (off) by default; the kit ships no tool and installs none.
# unused_code prints one finding per line (for example "vulture . --min-confidence 80" or "npx knip");
# coverage prints the covered percentage as a number on its last line. Both are listed, never blocking; a change needs an ADR.
unused_code = ""
coverage = ""
# Every criterion ACn of a done requirement needs a REQ-nnn ACn test marker: warn prints, block fails.
ac_coverage = "warn"
# Seconds each of the two runs of the proof check (proof.py) may take; a slow suite reads unknown.
proof_timeout = 900
# Hours a pull request may wait for a verdict before the decision inbox lists it (the weekly product report).
inbox_hours = 48
# How many pull requests a person may have open: "strict" (one at a time, no Depends-on line) or "flow" (any number, Depends-on allowed).
# Change it only with an ADR in the same pull request (agk.toml is a protected path).
pr_mode = "strict"
# The checks the router judges a pull request (and the default branch) by: the latest run of each listed check, and the latest status of each listed context. A check that is not listed (a preview build of a hosting service, say) never labels a pull request red; a listed check that has not reported keeps it running. A change needs an ADR.
required_checks = ["proof", "governance"]
# The GitHub Apps an agent posts through (slugs). A comment GitHub records as posted through one of them never counts as a person's approval, and while the list is not empty a review never counts either (a review shows no app); a project that wants reviews to count sets an empty list. A change needs an ADR.
agent_apps = ["claude"]
# Who reviews a pull request: "team" (the default: a verdict by a listed author, and a separate Approve: by a spec approver) or "solo"
# (one person: one confirmation comment, whose text a session prints and the person posts from the browser or the GitHub app, never a
# session, counts as the verdict, its Final lines and the spec approval of the head it names; refused when config/reviewers.yaml lists
# nobody or more than one person). A change needs an ADR.
review_mode = "team"
# Optional: the folder of the heavy-step lock of `python3 scripts/agk/lock.py` (the user's temp folder if unset), and the minutes after
# which a lock left by a session counts as stale and is cleared (120 if unset).
# lock_dir = ""
# lock_stale_minutes = 120
# Optional: how many heavy runs may hold the lock at once on this machine (1 if unset; with 1 nothing changes), and a
# cleanup command run once, through `sh -c`, when the lock of a run whose process no longer runs is cleared. The cleanup gets
# AGK_LOCK_SESSION and AGK_LOCK_PID of that run; its output is shown and a failure is reported, never blocking. The locked command
# also gets AGK_LOCK_SESSION, so a project can label what it starts by session. The kit ships no cleanup; an invented example is
# "docker ps -aq --filter label=agk.session=$AGK_LOCK_SESSION | xargs -r docker rm -f". A change needs an ADR (agk.toml is protected).
# lock_slots = 1
# lock_cleanup = ""
# Experimental, off by default: set experimental_reviewer = true, then run agk upgrade, to install the reviewer agent.
# Optional (brief #373): which tests guard which code. `python3 scripts/agk/test_plan.py` shows, as its regression section, the tests a
# change selects and the rule that chose each; `prepush.py` runs the selected regression tests, and proof runs them only with
# `proof_regression = true` (off by default). profile: "fast" (an unmapped file is only listed), "balanced" (the default: an unmapped
# file selects the full suite) or "thorough" (always the full suite). always_full: path globs that always select the full suite. map:
# each entry names code globs and the test globs that guard them. budget_seconds: the target time of the full suite (300 if unset).
# excluded: a list of "<tag>: <reason>" texts, the tests that the project's own command leaves out (brief #425); nothing in the
# selection interprets them, and proof lists them in its manifest. A change of only *.md files and docs/ selects nothing. A change
# needs an ADR in the same pull request (agk.toml is a protected path). See docs/guides/testing.md.
# [testing]
# profile = "balanced"
# always_full = ["migrations/**"]
# map = [{ code = "app/billing/**", tests = ["tests/billing/**"] }]
# budget_seconds = 300
# excluded = ["e2e: needs a browser the runner lacks"]
