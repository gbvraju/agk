# agk configuration. Read by the checks (earlier installs kept the stamp in pyproject.toml [tool.agk]).
mode = "init"
version = "{{kit_version}}"
installed = "{{date}}"
default_branch = "{{default_branch}}"
test_dirs = ["tests"]
lint_paths = ["scripts/agk", ".claude/hooks"]
# The project's own tests (run by agk-project-test; exit 5 = none collected is success).
project_tests = "[ -d tests ] || exit 0; python3 -m pytest tests -q; rc=$?; [ $rc -eq 5 ] && exit 0; exit $rc"
# Optional cleanup commands of the weekly drift audit, empty (off) by default; the kit ships no tool and installs none.
# unused_code prints one finding per line (for example "vulture . --min-confidence 80" or "npx knip");
# coverage prints the covered percentage as a number on its last line. Both are listed, never blocking; a change needs an ADR.
unused_code = ""
coverage = ""
# Every criterion ACn of a done requirement needs a REQ-nnn ACn test marker: warn prints, block fails.
ac_coverage = "warn"
# Seconds each of the two runs of the proof check (proof.py) may take; a slow suite reads unknown.
proof_timeout = 900
# Hours a pull request may wait for a verdict before the decision inbox lists it (the weekly product report).
inbox_hours = 48
# How many pull requests a person may have open: "strict" (one at a time, no Depends-on line) or "flow" (any number, Depends-on allowed).
# Change it only with an ADR in the same pull request (agk.toml is a protected path).
pr_mode = "strict"
# The checks the router judges a pull request (and the default branch) by: the latest run of each listed check, and the latest status of each listed context. A check that is not listed (a preview build of a hosting service, say) never labels a pull request red; a listed check that has not reported keeps it running. A change needs an ADR.
required_checks = ["proof", "governance"]
# The GitHub Apps an agent posts through (slugs). A comment GitHub records as posted through one of them never counts as a person's approval, and while the list is not empty a review never counts either (a review shows no app); a project that wants reviews to count sets an empty list. A change needs an ADR.
agent_apps = ["claude"]
# Who reviews a pull request: "team" (the default: a verdict by a listed author, and a separate Approve: by a spec approver) or "solo"
# (one person: one confirmation comment, whose text a session prints and the person posts from the browser or the GitHub app, never a
# session, counts as the verdict, its Final lines and the spec approval of the head it names; refused when config/reviewers.yaml lists
# nobody or more than one person). A change needs an ADR.
review_mode = "team"
# Optional: the percent of the plan's included Actions minutes past which `python3 scripts/agk/minutes.py` warns (80 if unset).
# minutes_warn = 80
# Optional: the folder of the heavy-step lock of `python3 scripts/agk/lock.py` (the user's temp folder if unset), and the minutes after
# which a lock left by a session counts as stale and is cleared (120 if unset).
# lock_dir = ""
# lock_stale_minutes = 120
# Optional: how many heavy runs may hold the lock at once on this machine (1 if unset; with 1 nothing changes), and a
# cleanup command run once, through `sh -c`, when the lock of a run whose process no longer runs is cleared. The cleanup gets
# AGK_LOCK_SESSION and AGK_LOCK_PID of that run; its output is shown and a failure is reported, never blocking. The locked command
# also gets AGK_LOCK_SESSION, so a project can label what it starts by session. The kit ships no cleanup; an invented example is
# "docker ps -aq --filter label=agk.session=$AGK_LOCK_SESSION | xargs -r docker rm -f". A change needs an ADR (agk.toml is protected).
# lock_slots = 1
# lock_cleanup = ""
# Optional (brief #441): where the heavy checks run: "hosted" (the default, also when unset: every check on GitHub-hosted runners),
# "hybrid" (the required light checks on GitHub-hosted runners, the heavy checks on a pool or locally), "pool" (a self-hosted pool,
# see docs/guides/self-hosted-runner.md) or "local" (see docs/guides/local-mode.md); any other value is refused. It changes no
# workflow: `python3 scripts/agk/execution.py` prints the setting in force and the profile the kit recommends for this repository
# and why, in one line. A top-level line (not inside a [table]); a change needs an ADR (agk.toml is protected).
# execution = "hosted"
# Optional: pause the kit (brief #348): while `paused = true` stands here, governance and proof report success with the one line
# "agk paused", the router writes no label and no session acts; `agk doctor` reports `paused`. Removing the line resumes; nothing is
# deleted. A top-level line (not inside a [table]); a change needs an ADR in the same pull request (agk.toml is a protected path).
# paused = true
# Experimental, off by default: set experimental_reviewer = true, then run agk upgrade, to install the reviewer agent.
# Engines (optional, off by default): the name of a skill the session can see for each step; absent means the kit's own template is used.
# An engine only drafts, through the kit's template and checks; it never decides, approves or edits a protected file. Choose once;
# a change needs an ADR in the same pull request (agk.toml is a protected path). `agk doctor` reports each as present, absent or missing.
# [engines]
# vision = "<skill name>"
# stack = "<skill name>"
# design = "<skill name>"
# review = "<skill name>"
# Optional settings of the session plan (session.py plan), off the defaults only when set. claim_stale_hours: the hours after which a
# claim (a taken: comment) whose session has posted nothing and has no open pull request no longer holds its brief (24 by default);
# the plan lists it as a stale claim. A change needs an ADR in the same pull request (agk.toml is a protected path).
# auto_start and launch_adapter (brief #331): at the end of each review pass the conductor re-plans (session.py plan --json); with
# auto_start = true and launch_adapter set to the project's own command (split into words, run without a shell, once per session with
# the prompt on its standard input), it starts the sessions the plan names through that command while the default branch says the same,
# never more than the plan's capacity or max_builders;
# with auto_start = false (the default) it prints their ready-to-paste prompts. The kit installs no adapter; the getting-started guide
# shows two examples. Each is a protected change: an ADR in the same pull request (agk.toml is a protected path).
# builder_memory_gb (brief #409): the memory, in whole GB (GiB), that one builder needs, with its containers. When set, the plan
# starts no more builders than the machine's available memory divided by it (rounded down; at least 1 while none runs) and names the limit that
# applied (max_builders, reviews or memory); when the memory cannot be read it says "memory: unknown" and keeps its other limits.
# Unset by default. A change needs an ADR in the same pull request (agk.toml is a protected path).
# [flow]
# claim_stale_hours = 24
# builder_memory_gb = 6
# auto_start = false
# launch_adapter = ""
# Optional (brief #373): which tests guard which code. `python3 scripts/agk/test_plan.py` shows, as its regression section, the tests a
# change selects and the rule that chose each; nothing runs the selection yet. profile: "fast" (an unmapped file is only listed),
# "balanced" (the default: an unmapped file selects the full suite) or "thorough" (always the full suite). always_full: path globs that
# always select the full suite. map: each entry names code globs and the test globs that guard them. budget_seconds: the target time of
# the full suite (300 if unset). A change of only *.md files and docs/ selects nothing. A change needs an ADR in the same pull request
# (agk.toml is a protected path). See docs/guides/testing.md.
# [testing]
# profile = "balanced"
# always_full = ["migrations/**"]
# map = [{ code = "app/billing/**", tests = ["tests/billing/**"] }]
# budget_seconds = 300
