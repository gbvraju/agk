# agk configuration. Read by the checks (earlier installs kept the stamp in pyproject.toml [tool.agk]).
mode = "init"
version = "{{kit_version}}"
installed = "{{date}}"
default_branch = "{{default_branch}}"
test_dirs = ["tests"]
lint_paths = ["scripts/agk", ".claude/hooks"]
# The project's own tests (run by agk-project-test; exit 5 = none collected is success).
project_tests = "[ -d tests ] || exit 0; python3 -m pytest tests -q; rc=$?; [ $rc -eq 5 ] && exit 0; exit $rc"
# Every criterion ACn of a done requirement needs a REQ-nnn ACn test marker: warn prints, block fails.
ac_coverage = "warn"
# Seconds each of the two runs of the proof check (proof.py) may take; a slow suite reads unknown.
proof_timeout = 900
# Hours a pull request may wait for a verdict before the decision inbox lists it (the weekly product report).
inbox_hours = 48
# Experimental, off by default: set experimental_reviewer = true, then run agk upgrade, to install the reviewer agent.
