# agk configuration. Read by the checks (earlier installs kept the stamp in pyproject.toml [tool.agk]).
mode = "init"
version = "{{kit_version}}"
installed = "{{date}}"
default_branch = "{{default_branch}}"
test_dirs = ["tests"]
lint_paths = ["scripts/agk", ".claude/hooks"]
# The project's own tests (run by agk-project-test; exit 5 = none collected is success).
project_tests = "[ -d tests ] || exit 0; python3 -m pytest tests -q; rc=$?; [ $rc -eq 5 ] && exit 0; exit $rc"
# Optional cleanup commands of the weekly drift audit, empty (off) by default; the kit ships no tool and installs none.
# unused_code prints one finding per line (for example "vulture . --min-confidence 80" or "npx knip");
# coverage prints the covered percentage as a number on its last line; mutation reads the file that AGK_CHANGED_FILES
# names (the code files changed in the last 7 days) and prints the share of injected faults killed on its last line.
# All three are listed, never blocking; a change needs an ADR.
unused_code = ""
coverage = ""
mutation = ""
# Every criterion ACn of a done requirement needs a REQ-nnn ACn test marker: warn prints, block fails.
ac_coverage = "warn"
# Seconds each of the two runs of the proof check (proof.py) may take; a slow suite reads unknown.
proof_timeout = 900
# Hours a pull request may wait for a verdict before the decision inbox lists it (the weekly product report).
inbox_hours = 48
# How many pull requests a person may have open: "strict" (one at a time, no Depends-on line) or "flow" (any number, Depends-on allowed).
# Change it only with an ADR in the same pull request (agk.toml is a protected path).
pr_mode = "strict"
# The checks the router judges a pull request (and the default branch) by: the latest run of each listed check, and the latest status of each listed context. A check that is not listed (a preview build of a hosting service, say) never labels a pull request red; a listed check that has not reported keeps it running. A change needs an ADR.
required_checks = ["proof", "governance"]
# The GitHub Apps an agent posts through (slugs). A comment GitHub records as posted through one of them never counts as a person's approval, and while the list is not empty a review never counts either (a review shows no app); a project that wants reviews to count sets an empty list. A change needs an ADR.
agent_apps = ["claude"]
# Who reviews a pull request: "team" (the default: a verdict by a listed author, and a separate Approve: by a spec approver) or "solo"
# (one person: one confirmation comment, whose text a session prints and the person posts from the browser or the GitHub app, never a
# session, counts as the verdict, its Final lines and the spec approval of the head it names; refused when config/reviewers.yaml lists
# nobody or more than one person). A change needs an ADR.
review_mode = "team"
# Optional: the percent of the plan's included Actions minutes past which `python3 scripts/agk/minutes.py` warns (80 if unset).
# minutes_warn = 80
# Optional: the folder of the heavy-step lock of `python3 scripts/agk/lock.py` (the user's temp folder if unset), and the minutes after
# which a lock left by a session counts as stale and is cleared (120 if unset).
# lock_dir = ""
# lock_stale_minutes = 120
# Optional: how many heavy runs may hold the lock at once on this machine (1 if unset; with 1 nothing changes), and a
# cleanup command run once, through `sh -c`, when the lock of a run whose process no longer runs is cleared. The cleanup gets
# AGK_LOCK_SESSION and AGK_LOCK_PID of that run; its output is shown and a failure is reported, never blocking. The locked command
# also gets AGK_LOCK_SESSION, so a project can label what it starts by session. The kit ships no cleanup; an invented example is
# "docker ps -aq --filter label=agk.session=$AGK_LOCK_SESSION | xargs -r docker rm -f". A change needs an ADR (agk.toml is protected).
# lock_slots = 1
# lock_cleanup = ""
# Optional (brief #441): where the heavy checks run: "hosted" (the default, also when unset: every check on GitHub-hosted runners),
# "hybrid" (the required light checks on GitHub-hosted runners, the heavy checks on a pool or locally), "pool" (a self-hosted pool,
# see docs/guides/self-hosted-runner.md) or "local" (see docs/guides/local-mode.md); any other value is refused. It changes no
# workflow: `python3 scripts/agk/execution.py` prints the setting in force and the profile the kit recommends for this repository
# and why, in one line. A top-level line (not inside a [table]); a change needs an ADR (agk.toml is protected).
# execution = "hosted"
# Optional: pause the kit (brief #348): while `paused = true` stands here, governance and proof report success with the one line
# "agk paused", the router writes no label and no session acts; `agk doctor` reports `paused`. Removing the line resumes; nothing is
# deleted. A top-level line (not inside a [table]); a change needs an ADR in the same pull request (agk.toml is a protected path).
# paused = true
# Experimental, off by default: set experimental_reviewer = true, then run agk upgrade, to install the reviewer agent.
# Engines (optional, off by default): the name of a skill the session can see for each step; absent means the kit's own template is used.
# An engine only drafts, through the kit's template and checks; it never decides, approves or edits a protected file. Choose once;
# a change needs an ADR in the same pull request (agk.toml is a protected path). `agk doctor` reports each as present, absent or missing.
# [engines]
# vision = "<skill name>"
# stack = "<skill name>"
# design = "<skill name>"
# review = "<skill name>"
# Optional settings of the session plan (session.py plan), off the defaults only when set. claim_stale_hours: the hours after which a
# claim (a taken: comment) whose session has posted nothing and has no open pull request no longer holds its brief (24 by default);
# the plan lists it as a stale claim. A change needs an ADR in the same pull request (agk.toml is a protected path).
# auto_start and launch_adapter (brief #331): at the end of each review pass the conductor re-plans (session.py plan --json); with
# auto_start = true and launch_adapter set to the project's own command (split into words, run without a shell, once per session with
# the prompt on its standard input), it starts the sessions the plan names through that command while the default branch says the same,
# never more than the plan's capacity or max_builders;
# with auto_start = false (the default) it prints their ready-to-paste prompts. The kit installs no adapter; the getting-started guide
# shows two examples. Each is a protected change: an ADR in the same pull request (agk.toml is a protected path).
# builder_memory_gb (brief #409): the memory, in whole GB (GiB), that one builder needs, with its containers. When set, the plan
# starts no more builders than the machine's available memory divided by it (rounded down; at least 1 while none runs) and names the limit that
# applied (max_builders, reviews or memory); when the memory cannot be read it says "memory: unknown" and keeps its other limits.
# Unset by default. A change needs an ADR in the same pull request (agk.toml is a protected path).
# auto_merge and auto_merge_method (SPEC-0039 rule 1): with auto_merge = true and auto_merge_method = "squash" (the only accepted
# method), the conductor runs `python3 scripts/agk/merge_cleared.py --pr <n> --sha <sha>` in the act of clearing; the command reads the
# two keys from this file as committed on the default branch of the remote, never from a pull request's head, and `agk doctor` prints
# `auto-merge: off` or `auto-merge: on, method squash`. Off (false) by default and when absent; any other value merges nothing. Turning
# it on is the owner's change: an ADR in the same pull request (agk.toml is a protected path).
# [flow]
# claim_stale_hours = 24
# builder_memory_gb = 6
# auto_start = false
# launch_adapter = ""
# auto_merge = false
# auto_merge_method = "squash"
# Optional (brief #373): which tests guard which code. `python3 scripts/agk/test_plan.py` shows, as its regression section, the tests a
# change selects and the rule that chose each; `prepush.py` runs the selected regression tests, and proof runs them only with
# `proof_regression = true` (off by default). profile: "fast" (an unmapped file is only listed), "balanced" (the default: an unmapped
# file selects the tests that name it, or the full suite when none does) or "thorough" (always the full suite). always_full: the test system's own files, which always select the full suite (any other entry needs an adjacent "# full: <reason>" comment). map:
# each entry names code globs and the test globs that guard them. budget_seconds: the target time of the full suite (300 if unset).
# excluded: a list of "<tag>: <reason>" texts, the tests that the project's own command leaves out (brief #425); nothing in the
# selection interprets them, and proof lists them in its manifest. A change of only *.md files and docs/ selects nothing. A change
# needs an ADR in the same pull request (agk.toml is a protected path). See docs/guides/testing.md. pr_tests: "full" (the default)
# or "selected": a pull request's CI runs only the selected tests, the default branch and releases the full suite (brief #453).
# [testing]
# profile = "balanced"
# always_full = ["conftest.py", "pytest.ini", "pyproject.toml"]
# map = [{ code = "app/billing/**", tests = ["tests/billing/**"] }]
# budget_seconds = 300
# excluded = ["e2e: needs a browser the runner lacks"]
# pr_tests = "full"
# Optional: the instruction files an agent reads, as paths or globs in order, for `python3 scripts/agk/rules.py budget`,
# `dropped` and `consolidate`; without it the four core files, `.claude/agents/*.md` and `config/review-checklist.md`.
# [rules]
# files = ["CLAUDE.md", "constitution/principles.md", "config/core-rules.md", "config/session-rules.md", ".claude/agents/*.md"]
# Optional (SPEC-0040, brief #529): the heavy-run queue of `python3 scripts/agk/lock.py`, off by default and when the table is absent,
# when nothing changes. With queue = true, `lock.py submit --name heavy --session ID [--kind prepush|proof|other] [--brief N] -- <cmd...>`
# queues one heavy run for the committed head and returns at once with a ticket, and `lock.py status --name heavy` shows the queue.
# queue_order: "priority" (the default: the brief's Priority: line, 0 first and unknown last, a brief that an open brief or pull request
# depends on one level higher, never to 0, and a job waiting longer than queue_max_wait minutes, 120 if unset, goes first) or "fifo"
# (submission order only). queue_autostart (off) and queue_idle_minutes (10) are the
# runner's. The table holds only these keys; any other value is refused naming the setting. A change needs an ADR (agk.toml is protected).
# [locks]
# queue = false
# queue_autostart = false
# queue_idle_minutes = 10
# queue_order = "priority"
# queue_max_wait = 120
# The plan's estimator (SPEC-0043 rules 12, 14 and 23): optional, and the defaults apply when the table is absent.
# calibration_min (10): the merged pull requests with a size and actual hours a calibrated estimate needs; iteration_days (10, 1 to 30):
# the working days of an iteration; default_hours: the owner's range per size for a brief without an Expected: line, printed as
# "owner default". The table holds only these keys; any other value is refused naming the setting. A change needs an ADR (agk.toml is protected).
# [plan]
# calibration_min = 10
# iteration_days = 10
# default_hours = { S = "2-4", M = "4-8", L = "8-16" }
# The data guard (SPEC-0042 rule 1, brief #589): always on; no key turns it off or removes a built-in rule. The [guard] table may only add:
# patterns (detector kinds CUSTOM-<name>), deny_paths (globs added to the secret files), deny_commands (added to the log commands),
# allowed_hosts (added to the local hosts), and allow_paths, the one escape: one relative file with a reason, never a built-in secret
# file, which the hook reads itself and allows only clean. An allow_paths or allowed_hosts entry counts only when it is also in agk.toml
# on the default branch. Any other key or value is refused, naming the setting. A change needs an ADR (agk.toml is protected).
# [guard]
# patterns = [{ name = "employee", regex = "EMP-\\d{5}" }]
# deny_paths = ["*.sqlite"]
# deny_commands = ["tail-prod"]
# allowed_hosts = ["db.internal.example.com"]
# allow_paths = [{ path = "docs/logs/README.md", reason = "a guide about logs, not a log" }]
# The work type (SPEC-0038 rule 5, REQ-045): one line that selects the delivery playbook of this project, config/playbooks/<work type>.toml,
# one of web-app, mobile, cloud-migration, rag-app, mcp-server, multi-agent, voice-agent and pilot, whose playbook must be present. Absent
# by default: with no [delivery] table nothing reads a playbook and `agk doctor` prints `work type: none (no playbook)`. One value only;
# an unknown one, or one whose playbook is missing, is refused naming the setting. The owner chooses it: a session may propose a work
# type and never writes, changes or removes the line. A change needs an ADR in the same pull request (agk.toml is a protected path).
# [delivery]
# work_type = "web-app"
# The design settings (SPEC-0037 rules 10 and 11, REQ-044), off when absent. A change needs an ADR (agk.toml is a protected path).
# [design]
# Globs of the project's UI files; a brief whose Touches: meets one needs a Screens: line (check_brief.py --root). Empty: no UI briefs.
# ui_paths = []
# The project's command that writes a built page for a screen and state, which the design comparison renders.
# render = ""
# The share of a screenshot's pixels that may differ before the comparison reports pixel drift; it only reports, never fails.
# pixel_tolerance = 0.01
# The model routes (SPEC-0045 rule 3, REQ-052), absent by default: every session then starts on one route. With
# builder_start = "start" a tier maps to the plain label of the scheduled task that starts it (or flag = true); with "assign" to its
# slots. A table names strongest; a tier with no route uses the next stronger one. No model name here. A change needs an ADR.
# [models.routes]
# strongest = { task = "builder-strongest" }
# mid = { task = "builder-mid" }
